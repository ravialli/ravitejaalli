<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07111f" />
  <title>Page not found | Ravi Teja Alli</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#07111f; --text:#f4f7fb; --muted:#9badc3; --accent:#6ee7f9; --line:rgba(255,255,255,.1); }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
      padding:32px; background:
        radial-gradient(circle at 82% 12%, rgba(110,231,249,.10), transparent 24rem),
        radial-gradient(circle at 12% 32%, rgba(138,168,255,.08), transparent 28rem),
        var(--bg);
      color:var(--text);
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height:1.6; letter-spacing:-.01em;
    }
    .code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--accent); letter-spacing:.3em; font-size:13px; text-transform:uppercase; }
    h1 { font-size:clamp(48px,9vw,88px); line-height:1; letter-spacing:-.05em; margin:14px 0 18px; }
    p { color:var(--muted); max-width:460px; margin:0 auto 30px; }
    a.button {
      display:inline-flex; align-items:center; gap:10px; min-height:50px; padding:0 22px;
      border-radius:14px; background:var(--accent); color:#06101e; font-weight:750; font-size:14px;
      text-decoration:none; border:1px solid var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Lost in the cloud.</h1>
    <p>That page couldn't be found — it may have moved, or the link was mistyped. Let's get you back to solid ground.</p>
    <a class="button" href="/">Return home</a>
  </main>
</body>
</html>
